name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - staging
      - staging
  schedule:
    # Every Monday at 08:00 UTC — weekly staging → main integration
    - cron: "0 8 * * 1"

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          pytest tests/unit -v

  weekly-staging-merge:
    name: Merge staging → main (weekly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Open PR from staging to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head staging \
            --title "chore: weekly staging → main integration $(date +%Y-%m-%d)" \
            --body "Automated weekly integration of staging into main." \
          || echo "PR already exists or staging is up to date with main."

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get next SemVer (bump minor)
        id: semver
        run: |
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          VERSION=${LATEST#v}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          NEW_TAG="v${MAJOR}.$((MINOR + 1)).0"
          echo "current=$LATEST" >> $GITHUB_OUTPUT
          echo "next=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "Bumping $LATEST → $NEW_TAG"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aseca-api:latest
            ghcr.io/${{ github.repository_owner }}/aseca-api:${{ steps.semver.outputs.next }}

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.semver.outputs.next }} -m "ci: release ${{ steps.semver.outputs.next }}"
          git push origin ${{ steps.semver.outputs.next }}